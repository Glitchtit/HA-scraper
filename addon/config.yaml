name: "Scraper"
version: "2.1.4"
slug: "scraper"
description: "Scrapes k-ruoka.fi for Finnish food products and populates HA-Storage."
url: "https://github.com/Glitchtit/HA-scraper"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: manual
ingress: true
ingress_port: 8099
panel_icon: "mdi:barcode-scan"
panel_title: "Scraper"
panel_admin: false
map:
  - config:ro
options:
  storage_hostname: ""
  store_id: "N110"
  upload_images: true
  use_graphql: true
  flaresolverr_url: ""
  searxng_url: ""
schema:
  storage_hostname: str?
  storage_url: str?
  store_id: str
  upload_images: bool
  use_graphql: bool
  flaresolverr_url: str?
  searxng_url: str?
