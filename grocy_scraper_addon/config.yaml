name: "Grocy Scraper"
version: "1.20.2"
slug: "grocy_scraper"
description: "Scrapes k-ruoka.fi for Finnish food products and populates a Grocy database via HA-Storage."
url: "https://github.com/Glitchtit/grocy_scraper"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: manual
ingress: true
ingress_port: 8099
panel_icon: "mdi:barcode-scan"
panel_title: "Grocy Scraper"
panel_admin: false
map:
  - config:ro
options:
  storage_url: "http://a0a9ed235_ha_storage:8099"
  store_id: "N110"
  location_id: 0
  quantity_unit_id: 0
  discover_interval: 60
  upload_images: true
  use_graphql: true
  flaresolverr_url: ""
  gemini_api_key: ""
  gemini_model: "gemini-1.5-flash"
  gemini_model_optimize: ""
  searxng_url: ""
schema:
  storage_url: str
  store_id: str
  location_id: int
  quantity_unit_id: int
  discover_interval: int
  upload_images: bool
  use_graphql: bool
  flaresolverr_url: str?
  gemini_api_key: str?
  gemini_model: str?
  gemini_model_optimize: str?
  searxng_url: str?
