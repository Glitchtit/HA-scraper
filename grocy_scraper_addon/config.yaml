name: "Grocy Scraper"
version: "1.14.0"
slug: "grocy_scraper"
description: "Scrapes k-ruoka.fi for Finnish food products and populates a Grocy database. Integrates with Barcode Buddy for automated discovery."
url: "https://github.com/Glitchtit/grocy_scraper"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: manual
ingress: true
ingress_port: 8099
panel_icon: "mdi:barcode-scan"
panel_title: "Grocy Scraper"
panel_admin: false
map:
  - config:ro
options:
  grocy_url: ""
  grocy_api_key: ""
  store_id: "N110"
  location_id: 0
  quantity_unit_id: 0
  discover_interval: 60
  upload_images: true
  use_graphql: true
  flaresolverr_url: ""
  bbuddy_url: ""
  bbuddy_api_key: ""
  bbuddy_user: ""
  bbuddy_password: ""
  gemini_api_key: ""
  gemini_model: "gemini-1.5-flash"
  searxng_url: ""
schema:
  grocy_url: str
  grocy_api_key: str
  store_id: str
  location_id: int
  quantity_unit_id: int
  discover_interval: int
  upload_images: bool
  use_graphql: bool
  flaresolverr_url: str?
  bbuddy_url: str?
  bbuddy_api_key: str?
  bbuddy_user: str?
  bbuddy_password: str?
  gemini_api_key: str?
  gemini_model: str?
  searxng_url: str?
